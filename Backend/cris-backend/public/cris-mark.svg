<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">CRIS Logo - CHED Commission</title>
  <desc id="desc">Calabarzon Research Information System - Commission on Higher Education branded logo</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047d4"/>
      <stop offset="100%" stop-color="#0033a0"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b3d9ff"/>
      <stop offset="100%" stop-color="#80b5ff"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2" flood-color="#0033a0"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Shield shape for institutional authority -->
  <path d="M64 20 L90 35 L90 55 C90 75 64 95 64 95 C64 95 38 75 38 55 L38 35 Z" fill="#ffffff" opacity="0.15"/>
  
  <!-- Open book representing research/knowledge -->
  <g transform="translate(64, 64)">
    <!-- Left page -->
    <path d="M-18 -8 L-4 -8 L-4 12 L-18 12 Z" fill="#ffffff" stroke="none"/>
    <!-- Right page -->
    <path d="M4 -8 L18 -8 L18 12 L4 12 Z" fill="#ffffff" stroke="none"/>
    <!-- Book spine -->
    <rect x="-2" y="-8" width="4" height="20" fill="url(#accentGradient)"/>
    
    <!-- Document lines on left page -->
    <line x1="-16" y1="-4" x2="-6" y2="-4" stroke="#0033a0" stroke-width="1.5" opacity="0.6"/>
    <line x1="-16" y1="0" x2="-6" y2="0" stroke="#0033a0" stroke-width="1.5" opacity="0.6"/>
    <line x1="-16" y1="4" x2="-10" y2="4" stroke="#0033a0" stroke-width="1.5" opacity="0.6"/>
    <line x1="-16" y1="8" x2="-8" y2="8" stroke="#0033a0" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Document lines on right page -->
    <line x1="6" y1="-4" x2="16" y2="-4" stroke="#0033a0" stroke-width="1.5" opacity="0.6"/>
    <line x1="6" y1="0" x2="16" y2="0" stroke="#0033a0" stroke-width="1.5" opacity="0.6"/>
    <line x1="6" y1="4" x2="16" y2="4" stroke="#0033a0" stroke-width="1.5" opacity="0.6"/>
    <line x1="6" y1="8" x2="14" y2="8" stroke="#0033a0" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Research/data accent - stylized flask/beaker overlay -->
    <circle cx="0" cy="16" r="5" fill="url(#accentGradient)" opacity="0.8"/>
    <path d="M-1 11 L1 11 L1 16" stroke="url(#accentGradient)" stroke-width="1.5" fill="none" opacity="0.9"/>
  </g>
  
  <!-- Top accent - star/excellence -->
  <g transform="translate(64, 24)">
    <circle cx="0" cy="0" r="4" fill="#fbbf24" opacity="0.9"/>
  </g>
</svg>