name: Quality Checks

on:
  pull_request:
    paths:
      - "Backend/cris-backend/**"
      - ".github/workflows/quality.yml"
  push:
    branches: [main, master, develop]
    paths:
      - "Backend/cris-backend/**"
      - ".github/workflows/quality.yml"

jobs:
  php:
    name: PHP (Pint + PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/cris-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: Backend/cris-backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('Backend/cris-backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy env
        run: cp .env.example .env

      - name: App key
        run: php artisan key:generate

      - name: Pint (style check)
        run: composer format:check

      - name: PHPUnit
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test

  js:
    name: JS (ESLint + Prettier + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/cris-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Backend/cris-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Vitest
        run: npm run test:unit
